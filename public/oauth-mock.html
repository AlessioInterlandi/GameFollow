<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Authorize · GameFollow</title>
<style>
  :root{--ink:#171717;--muted:#6f7175;--line:#e8e8e8}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f4f4f4;font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:var(--ink)}
  .box{background:#fff;border:1px solid var(--line);border-radius:12px;padding:28px;width:340px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.08)}
  .logo{font-size:18px;font-weight:750;margin-bottom:4px}
  .logo span{color:#ff9d00}
  h1{font-size:16px;margin:18px 0 6px}
  p{color:var(--muted);font-size:13px;margin:0 0 20px}
  .perms{text-align:left;background:#fafafa;border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-bottom:20px;font-size:12px;color:#444}
  .perms li{margin:4px 0}
  .azioni{display:flex;gap:10px}
  button{flex:1;font:inherit;font-size:13px;padding:10px;border-radius:7px;border:1px solid var(--line);background:#fff;cursor:pointer}
  .autorizza{background:#ff9800;color:#fff;border-color:#ff9800;font-weight:600}
  .stato{font-size:12px;color:var(--muted);margin-top:14px}
</style>
</head>
<body>
  <div class="box">
    <div class="logo">Game<span>Follow</span></div>
    <h1 id="titolo">Authorize connection</h1>
    <p id="descrizione">GameFollow wants to connect to your account.</p>
    <ul class="perms">
      <li>Read basic account info</li>
      <li>Create items on your behalf (issues, tickets, messages)</li>
      <li>No access to your password</li>
    </ul>
    <div class="azioni">
      <button id="nega" type="button">Cancel</button>
      <button id="autorizza" class="autorizza" type="button">Authorize</button>
    </div>
    <p class="stato" id="stato"></p>
  </div>

<script>
  const parametri = new URLSearchParams(window.location.search);
  const provider = parametri.get('provider');
  const nome = parametri.get('nome') || provider || 'this service';

  document.getElementById('titolo').textContent = `Connect ${nome}`;
  document.getElementById('descrizione').textContent = `GameFollow wants to connect to your ${nome} account.`;

  function notificaEChiudi(ok) {
    if (window.opener) {
      window.opener.postMessage({ tipo: 'gamefollow-oauth', provider, ok }, window.location.origin);
    }
    window.close();
  }

  document.getElementById('nega').addEventListener('click', () => notificaEChiudi(false));

  document.getElementById('autorizza').addEventListener('click', async () => {
    const stato = document.getElementById('stato');
    const bottone = document.getElementById('autorizza');
    bottone.disabled = true;
    stato.textContent = 'Connecting…';

    try {
      const risposta = await fetch(`/api/integrazioni/${encodeURIComponent(provider)}/collega`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
      });
      if (!risposta.ok) throw new Error('Connection failed');
      notificaEChiudi(true);
    } catch {
      stato.textContent = 'Something went wrong. You can close this window and try again.';
      bottone.disabled = false;
    }
  });
</script>
</body>
</html>
